name: Criar chave de assinatura (rodar UMA vez)

on:
  workflow_dispatch:
    inputs:
      senha:
        description: 'Senha da chave (min. 8 caracteres, sem espacos)'
        required: true
      alias:
        description: 'Apelido da chave'
        required: true
        default: 'corridabr-motorista'

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias "${{ inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.senha }}" -keypass "${{ inputs.senha }}" \
            -dname "CN=CorridaBR Motorista, OU=App, O=CorridaBR, L=Brasilia, ST=DF, C=BR"
          base64 -w0 release.jks > keystore-base64.txt

      - name: Baixar os arquivos
        uses: actions/upload-artifact@v4
        with:
          name: chave-de-assinatura
          path: |
            release.jks
            keystore-base64.txt
          retention-days: 3
